<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本 - Circle Geometry Quiz</title>
    <style>
        /* 全局样式 - 与主页面保持一致 */
        :root {
            --primary-color: #2563eb;
            --success-color: #f97316;
            --error-color: #ef4444;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --font-size-sm: 14px;
            --font-size-md: 16px;
            --font-size-lg: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            transition: font-size 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size-md);
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 头部导航 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 面包屑+返回按钮 */
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .breadcrumb {
            font-size: 0.9em;
        }

        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .back-btn {
            padding: 6px 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .back-btn:hover {
            background-color: #1d4ed8;
        }

        /* 字体+语言控制区 */
        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-item label {
            font-size: 0.9em;
            color: var(--text-color);
        }

        .control-select {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            min-width: 80px;
        }

        .control-select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 错题本容器 */
        .wrong-book-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .wrong-book-container h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }

        /* 错题本操作栏 */
        .wrong-book-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .clear-btn {
            background-color: var(--error-color);
            color: white;
        }

        .clear-btn:hover {
            background-color: #dc2626;
        }

        /* 错题列表 */
        .wrong-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 错题卡片 */
        .wrong-card {
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
        }

        .wrong-card .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            border: none;
            color: var(--error-color);
            cursor: pointer;
            font-size: 1.2em;
        }

        .wrong-card .delete-btn:hover {
            color: #dc2626;
        }

        .wrong-card h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .wrong-card .options {
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .wrong-card .option {
            padding: 8px;
            border-radius: 4px;
        }

        .wrong-card .option.user-answer {
            background-color: #fee2e2;
            border: 1px solid var(--error-color);
        }

        .wrong-card .option.correct-answer {
            background-color: #dcfce7;
            border: 1px solid #22c55e;
        }

        .wrong-card .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            background-color: #fef2f2;
            color: var(--error-color);
        }

        /* 空状态提示 */
        .empty-tip {
            text-align: center;
            padding: 50px 0;
            color: #64748b;
            font-size: 1.1em;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-left {
                width: 100%;
                margin-bottom: 10px;
            }

            .control-group {
                width: 100%;
                justify-content: flex-start;
            }

            .wrong-book-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <!-- 面包屑+返回按钮 -->
        <div class="header-left">
            <nav class="breadcrumb">
                <a id="breadcrumb-home" href="../index.html" data-i18n="breadcrumb_home">首页</a> &gt; 
                <span id="breadcrumb-wrong" data-i18n="wrong_book">错题本</span>
            </nav>
            <!-- 返回测验页按钮 -->
            <button id="back-btn" class="back-btn" data-i18n="back_to_quiz">返回测验</button>
        </div>
        
        <!-- 字体+语言控制区 -->
        <div class="control-group">
            <!-- 字体大小下拉框 -->
            <div class="control-item">
                <label for="font-select" data-i18n="font_size">字体大小：</label>
                <select id="font-select" class="control-select">
                    <option value="sm" data-i18n="font_small">小</option>
                    <option value="md" data-i18n="font_medium" selected>中</option>
                    <option value="lg" data-i18n="font_large">大</option>
                </select>
            </div>
            <!-- 语言切换下拉框 -->
            <div class="control-item">
                <label for="lang-select" data-i18n="language">语言：</label>
                <select id="lang-select" class="control-select">
                    <option value="zh" selected>中文</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </header>

    <main class="wrong-book-container">
        <h1 data-i18n="wrong_book_title">错题本</h1>
        
        <!-- 错题本操作栏 -->
        <div class="wrong-book-actions">
            <button id="clear-all-btn" class="action-btn clear-btn" data-i18n="clear_all">清空所有错题</button>
        </div>
        
        <!-- 错题列表 -->
        <div id="wrong-list" class="wrong-list">
            <!-- 错题卡片动态生成 -->
        </div>
        
        <!-- 空状态提示 -->
        <div id="empty-tip" class="empty-tip hidden" data-i18n="empty_wrong_book">暂无错题，继续刷题吧！</div>
    </main>

    <footer>
        <p data-i18n="footer_text">EBU5315 交互式媒体设计 | GCSE 圆几何学习</p>
    </footer>

    <script>
        // 1. 双语文本库
        const i18n = {
            en: {
                breadcrumb_home: "Home",
                wrong_book: "Wrong Answer Book",
                back_to_quiz: "Back to Quiz",
                font_size: "Font Size:",
                font_small: "Small",
                font_medium: "Medium",
                font_large: "Large",
                language: "Language:",
                wrong_book_title: "Wrong Answer Book",
                clear_all: "Clear All Wrong Answers",
                empty_wrong_book: "No wrong answers yet, keep practicing!",
                question: "Question",
                your_answer: "Your Answer",
                correct_answer: "Correct Answer",
                feedback: "Explanation",
                footer_text: "EBU5315 Interactive Media Design | GCSE Circle Geometry Learning"
            },
            zh: {
                breadcrumb_home: "首页",
                wrong_book: "错题本",
                back_to_quiz: "返回测验",
                font_size: "字体大小：",
                font_small: "小",
                font_medium: "中",
                font_large: "大",
                language: "语言：",
                wrong_book_title: "错题本",
                clear_all: "清空所有错题",
                empty_wrong_book: "暂无错题，继续刷题吧！",
                question: "题目",
                your_answer: "你的答案",
                correct_answer: "正确答案",
                feedback: "解析",
                footer_text: "EBU5315 交互式媒体设计 | GCSE 圆几何学习"
            }
        };

        // 2. 全局变量
        let currentLang = 'zh';
        let wrongQuestions = [];

        // 3. 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadWrongQuestions();  // 加载错题数据
            initFontControl();     // 初始化字体设置
            initLangControl();     // 初始化语言设置
            initBackBtn();         // 初始化返回按钮
            initClearAllBtn();     // 初始化清空按钮
            renderWrongList();     // 渲染错题列表
        });

        // 4. 加载本地存储的错题
        function loadWrongQuestions() {
            const savedWrong = localStorage.getItem('quizWrongQuestions');
            wrongQuestions = savedWrong ? JSON.parse(savedWrong) : [];
        }

        // 5. 字体大小控制（同步主页面设置）
        function initFontControl() {
            const fontSelect = document.getElementById('font-select');
            const body = document.body;

            // 监听下拉框变化
            fontSelect.addEventListener('change', function() {
                const fontSize = this.value;
                switch(fontSize) {
                    case 'sm':
                        body.style.fontSize = 'var(--font-size-sm)';
                        break;
                    case 'md':
                        body.style.fontSize = 'var(--font-size-md)';
                        break;
                    case 'lg':
                        body.style.fontSize = 'var(--font-size-lg)';
                        break;
                }
                localStorage.setItem('quizFontSize', fontSize);
            });

            // 恢复上次的字体设置
            const savedFont = localStorage.getItem('quizFontSize');
            if (savedFont) {
                fontSelect.value = savedFont;
                body.style.fontSize = `var(--font-size-${savedFont})`;
            }
        }

        // 6. 语言控制（同步主页面设置）
        function initLangControl() {
            const langSelect = document.getElementById('lang-select');

            // 监听下拉框变化
            langSelect.addEventListener('change', function() {
                const lang = this.value;
                changeLanguage(lang);
                localStorage.setItem('quizLang', lang);
                renderWrongList(); // 重新渲染错题列表
            });

            // 恢复上次的语言设置
            const savedLang = localStorage.getItem('quizLang');
            if (savedLang) {
                langSelect.value = savedLang;
                changeLanguage(savedLang);
            }
        }

        // 7. 切换语言
        function changeLanguage(lang) {
            currentLang = lang;
            // 更新所有静态文本
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                el.textContent = i18n[lang][key];
            });
            // 更新字体下拉框选项
            updateFontSelectText();
        }

        // 8. 更新字体下拉框文本
        function updateFontSelectText() {
            const fontSelect = document.getElementById('font-select');
            Array.from(fontSelect.options).forEach(option => {
                const key = option.dataset.i18n;
                if (key) option.textContent = i18n[currentLang][key];
            });
        }

        // 9. 初始化返回按钮
        function initBackBtn() {
            const backBtn = document.getElementById('back-btn');
            backBtn.addEventListener('click', function() {
                window.location.href = 'quiz-main.html';
            });
        }

        // 10. 初始化清空按钮
        function initClearAllBtn() {
            const clearBtn = document.getElementById('clear-all-btn');
            clearBtn.addEventListener('click', function() {
                const confirmText = currentLang === 'zh' ? '确定要清空所有错题吗？' : 'Are you sure to clear all wrong answers?';
                if (confirm(confirmText)) {
                    localStorage.removeItem('quizWrongQuestions');
                    wrongQuestions = [];
                    renderWrongList();
                }
            });
        }

        // 11. 删除单道错题
        function deleteWrongQuestion(questionId) {
            const confirmText = currentLang === 'zh' ? '确定要删除这道错题吗？' : 'Are you sure to delete this wrong answer?';
            if (confirm(confirmText)) {
                // 过滤掉要删除的题目
                wrongQuestions = wrongQuestions.filter(q => q.id !== questionId);
                // 更新本地存储
                localStorage.setItem('quizWrongQuestions', JSON.stringify(wrongQuestions));
                // 重新渲染
                renderWrongList();
            }
        }

        // 12. 渲染错题列表
        function renderWrongList() {
            const wrongListEl = document.getElementById('wrong-list');
            const emptyTipEl = document.getElementById('empty-tip');

            // 清空现有内容
            wrongListEl.innerHTML = '';

            // 空状态处理
            if (wrongQuestions.length === 0) {
                wrongListEl.classList.add('hidden');
                emptyTipEl.classList.remove('hidden');
                return;
            }

            // 显示错题列表
            wrongListEl.classList.remove('hidden');
            emptyTipEl.classList.add('hidden');

            // 遍历生成错题卡片
            wrongQuestions.forEach((question, index) => {
                const questionData = question[currentLang];
                const cardEl = document.createElement('div');
                cardEl.className = 'wrong-card';

                // 错题卡片内容
                cardEl.innerHTML = `
                    <button class="delete-btn" data-id="${question.id}">×</button>
                    <h3>${i18n[currentLang].question} ${index + 1}：${questionData.question}</h3>
                    <div class="options">
                        <div class="option user-answer">${i18n[currentLang].your_answer}：${questionData.options[question.userAnswer]}</div>
                        <div class="option correct-answer">${i18n[currentLang].correct_answer}：${questionData.options[question.answer]}</div>
                    </div>
                    <div class="feedback">${i18n[currentLang].feedback}：${questionData.feedback}</div>
                `;

                // 添加删除按钮事件
                const deleteBtn = cardEl.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', function() {
                    const questionId = parseInt(this.dataset.id);
                    deleteWrongQuestion(questionId);
                });

                // 添加到列表
                wrongListEl.appendChild(cardEl);
            });
        }
    </script>
</body>
</html>
